<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Reset Password | Quick Notes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="public-page">

  <div class="container">
    <!-- Flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div id="flash-messages">
      {% for category, message in messages %}
      <div class="flash
              {% if category == 'success' %}flash-success
              {% elif category == 'danger' %}flash-danger
              {% elif category == 'warning' %}flash-warning
              {% elif category == 'info' %}flash-info
              {% endif %}">
        {{ message }}
      </div>
      {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    <h1>Reset Password</h1>
    <p>Update your account password.</p>

    <form method="POST" action="{{ url_for('reset_password', token=token) }}" onsubmit="return validatePasswords()">
      <div class="input-group">
        <input type="password" id="password" name="password" placeholder="New Password" required>
        <span class="eye-icon" onclick="togglePassword('password', this)">&#128065;</span>
      </div>
      <div class="input-group">
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter New Password"
          required>
        <span class="eye-icon" onclick="togglePassword('confirm_password', this)">&#128065;</span>
      </div>
      <button type="submit" class="btn">Reset Password</button>
    </form>
  </div>

  <div class="footer">
    © 2025 Quick Notes
  </div>

  <script>
    function togglePassword(id, el) {
      let input = document.getElementById(id);
      if (input.type === "password") {
        input.type = "text";
        el.innerHTML = "&#128064;"; // Open eye
      } else {
        input.type = "password";
        el.innerHTML = "&#128065;"; // Closed eye
      }
    }

    function validatePasswords() {
      const pass = document.getElementById("password").value.trim();
      const confirm = document.getElementById("confirm_password").value.trim();

      const strongPassword = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^\w\s]).{4,}$/;

      if (pass !== confirm) {
        alert("Passwords do not match!");
        return false;
      }

      if (!strongPassword.test(pass)) {
        alert("Password must be at least 4 characters long and include uppercase, lowercase, number, and special character.");
        return false;
      }

      return true;
    }
  </script>

</body>

</html>
